name: Build & push backend image

on:
  push:
    branches: [master]
    paths:
      - 'apps/backend/**'
      - '.github/workflows/docker.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: apps/backend
          file: apps/backend/Dockerfile
          push: true
          tags: |
            ghcr.io/gradepurity/backend:latest
            ghcr.io/gradepurity/backend:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Railway pollt GHCR niet: zonder expliciete redeploy blijft prod op de
      # oude image draaien (dat gebeurde 9–13 juli). Trigger daarom na elke
      # geslaagde push een redeploy van de backend-service.
      - name: Redeploy backend op Railway
        run: |
          RESP=$(curl -s -X POST https://backboard.railway.app/graphql/v2 \
            -H "Project-Access-Token: ${{ secrets.RAILWAY_PROJECT_TOKEN }}" \
            -H "Content-Type: application/json" \
            -d '{"query":"mutation { serviceInstanceRedeploy(environmentId: \"bfc50eb6-ff1a-46ce-bd68-0c4cee9a115d\", serviceId: \"331843f2-ad54-4103-9b05-541e47adb4ab\") }"}')
          echo "$RESP"
          echo "$RESP" | grep -q '"serviceInstanceRedeploy":true'
